name: Refresh profile cards

on:
  schedule:
    - cron: "30 2 * * *"      # daily, 02:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.json, render_cards.py, fetch_contributions.py, "fonts/**", ".github/workflows/update-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonttools (provides pyftsubset)
        run: pip install fonttools

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python3 fetch_contributions.py

      - name: Render cards
        run: python3 render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards contribution_data.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards"
            git pull --rebase
            git push
          fi
