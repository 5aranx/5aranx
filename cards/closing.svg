<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="Learn · Build · Test · Explain · Improve"><title>Learn · Build · Test · Explain · Improve</title><defs><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><radialGradient id="gl" cx="82%" cy="-12%" r="78%"><stop offset="0" stop-color="#8e2439" stop-opacity=".55"/><stop offset="1" stop-color="#0b0608" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Fraunces';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.disp{font-family:'Fraunces',Georgia,serif;font-weight:400}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes wipe{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both}.grow{animation:grow .7s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:50% 100%}.wipe{animation:wipe .6s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:0 50%}.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="879" height="95" rx="2" fill="#0b0608"/><g class="rise"><line x1="36" y1="48" x2="237.895" y2="48" stroke="rgba(233,222,219,.11)" stroke-width="1"/><line x1="642.105" y1="48" x2="844" y2="48" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="440" y="55" class="disp" font-size="20" fill="#e9dedb" text-anchor="middle">Learn · Build · Test · Explain · Improve</text></g><rect width="880" height="96" rx="2" filter="url(#gr)" opacity=".05" pointer-events="none"/><rect x=".5" y=".5" width="879" height="95" rx="2" fill="none" stroke="rgba(233,222,219,.24)"/></svg>