<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Priorities for 2026."><title>Priorities for 2026.</title><defs><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><radialGradient id="gl" cx="82%" cy="-12%" r="78%"><stop offset="0" stop-color="#8e2439" stop-opacity=".55"/><stop offset="1" stop-color="#0b0608" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.mono{font-family:'Space Mono',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sans{font-family:'Space Grotesk',Georgia,serif;font-weight:400}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes wipe{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both}.grow{animation:grow .7s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:50% 100%}.wipe{animation:wipe .6s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:0 50%}.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="879" height="239" rx="2" fill="#0b0608"/><g class="rise"><text x="36" y="46" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.4">06</text><text x="66" y="46" class="mono" font-size="10" fill="#97817e" letter-spacing="1.4">2026 PRIORITIES</text><text x="844" y="46" class="mono" font-size="9.5" fill="#7b6663" text-anchor="end" letter-spacing="1.2">DIRECTION</text><line x1="36" y1="58" x2="844" y2="58" stroke="rgba(233,222,219,.24)" stroke-width="1"/></g><g class="rise" style="animation-delay:120ms"><text x="36" y="96" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">01</text><text x="92" y="96" class="sans" font-size="14.5" fill="#b9a6a3">Turn the PUF work into a measurement-backed write-up rather than a demo.</text></g><g class="rise" style="animation-delay:180ms"><text x="36" y="130" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">02</text><text x="92" y="130" class="sans" font-size="14.5" fill="#b9a6a3">Publish sanitised Drax findings so the methodology is readable without the tool.</text></g><g class="rise" style="animation-delay:240ms"><text x="36" y="164" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">03</text><text x="92" y="164" class="sans" font-size="14.5" fill="#b9a6a3">Build more blue-team detection queries and test them against real logs.</text></g><g class="rise" style="animation-delay:300ms"><text x="36" y="198" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">04</text><text x="92" y="198" class="sans" font-size="14.5" fill="#b9a6a3">Contribute upstream to tools I already depend on: Frida scripts, ESP-IDF examples, Ryoku.</text></g><rect width="880" height="240" rx="2" filter="url(#gr)" opacity=".05" pointer-events="none"/><rect x=".5" y=".5" width="879" height="239" rx="2" fill="none" stroke="rgba(233,222,219,.24)"/></svg>