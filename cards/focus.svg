<svg xmlns="http://www.w3.org/2000/svg" width="880" height="345" viewBox="0 0 880 345" role="img" aria-label="Technical focus: areas and the tools used in each."><title>Technical focus: areas and the tools used in each.</title><defs><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><radialGradient id="gl" cx="82%" cy="-12%" r="78%"><stop offset="0" stop-color="#8e2439" stop-opacity=".55"/><stop offset="1" stop-color="#0b0608" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.mono{font-family:'Space Mono',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sans{font-family:'Space Grotesk',Georgia,serif;font-weight:400}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes wipe{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both}.grow{animation:grow .7s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:50% 100%}.wipe{animation:wipe .6s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:0 50%}.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="879" height="344" rx="2" fill="#0b0608"/><g class="rise"><text x="36" y="46" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.4">03</text><text x="66" y="46" class="mono" font-size="10" fill="#97817e" letter-spacing="1.4">TECHNICAL FOCUS</text><text x="844" y="46" class="mono" font-size="9.5" fill="#7b6663" text-anchor="end" letter-spacing="1.2">NOT A RANKING</text><line x1="36" y1="58" x2="844" y2="58" stroke="rgba(233,222,219,.24)" stroke-width="1"/></g><g class="rise" style="animation-delay:120ms"><line x1="36" y1="76" x2="844" y2="76" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="36" y="98" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.3">OFFENSIVE SECURITY</text><text x="232" y="98" class="sans" font-size="14" fill="#b9a6a3">Metasploit, Kali Linux, Android pentesting, PortSwigger labs (SQLi, XSS, SSRF, LLM prompt</text><text x="232" y="119" class="sans" font-size="14" fill="#b9a6a3">injection)</text></g><g class="rise" style="animation-delay:120ms"><line x1="36" y1="134" x2="844" y2="134" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="36" y="156" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.3">MOBILE</text><text x="232" y="156" class="sans" font-size="14" fill="#b9a6a3">ADB, Frida, SSL pinning and root detection, RASP-protected apps</text></g><g class="rise" style="animation-delay:120ms"><line x1="36" y1="171" x2="844" y2="171" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="36" y="193" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.3">HARDWARE</text><text x="232" y="193" class="sans" font-size="14" fill="#b9a6a3">ESP32 and ESP32-S3, ESP-IDF, BLE, SRAM PUFs, BCH error correction</text></g><g class="rise" style="animation-delay:120ms"><line x1="36" y1="208" x2="844" y2="208" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="36" y="230" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.3">LANGUAGES</text><text x="232" y="230" class="sans" font-size="14" fill="#b9a6a3">Python, C, C++, TypeScript, SQL</text></g><g class="rise" style="animation-delay:120ms"><line x1="36" y1="245" x2="844" y2="245" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="36" y="267" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.3">BACKEND AND TOOLING</text><text x="232" y="267" class="sans" font-size="14" fill="#b9a6a3">Flask, Docker, QEMU/KVM, Git, Linux</text></g><g class="rise" style="animation-delay:120ms"><line x1="36" y1="282" x2="844" y2="282" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="36" y="304" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.3">BLUE TEAM</text><text x="232" y="304" class="sans" font-size="14" fill="#b9a6a3">Log analysis, kill-chain mapping, IoC extraction</text></g><rect width="880" height="345" rx="2" filter="url(#gr)" opacity=".05" pointer-events="none"/><rect x=".5" y=".5" width="879" height="344" rx="2" fill="none" stroke="rgba(233,222,219,.24)"/></svg>