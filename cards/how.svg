<svg xmlns="http://www.w3.org/2000/svg" width="880" height="376" viewBox="0 0 880 376" role="img" aria-label="How I work."><title>How I work.</title><defs><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><radialGradient id="gl" cx="82%" cy="-12%" r="78%"><stop offset="0" stop-color="#8e2439" stop-opacity=".55"/><stop offset="1" stop-color="#0b0608" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.mono{font-family:'Space Mono',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sans{font-family:'Space Grotesk',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:600;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sansb{font-family:'Space Grotesk',Georgia,serif;font-weight:600}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes wipe{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both}.grow{animation:grow .7s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:50% 100%}.wipe{animation:wipe .6s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:0 50%}.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="879" height="375" rx="2" fill="#0b0608"/><g class="rise"><text x="36" y="46" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.4">04</text><text x="66" y="46" class="mono" font-size="10" fill="#97817e" letter-spacing="1.4">HOW I WORK</text><text x="844" y="46" class="mono" font-size="9.5" fill="#7b6663" text-anchor="end" letter-spacing="1.2">4 RULES</text><line x1="36" y1="58" x2="844" y2="58" stroke="rgba(233,222,219,.24)" stroke-width="1"/></g><g class="rise" style="animation-delay:120ms"><text x="36" y="96" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">01</text><text x="76" y="96" class="sansb" font-size="15" fill="#e9dedb">Authorised scope only.</text><text x="76" y="120" class="sans" font-size="13.5" fill="#b9a6a3">Drax exists for assessments on apps I own or have been engaged to test. The README says that before it says</text><text x="76" y="140" class="sans" font-size="13.5" fill="#b9a6a3">anything else.</text></g><g class="rise" style="animation-delay:180ms"><text x="36" y="174" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">02</text><text x="76" y="174" class="sansb" font-size="15" fill="#e9dedb">Ask what the attacker gets.</text><text x="76" y="198" class="sans" font-size="13.5" fill="#b9a6a3">For the PUF drone design the question was what a firmware dump reveals. The answer is public helper data and</text><text x="76" y="218" class="sans" font-size="13.5" fill="#b9a6a3">nothing else.</text></g><g class="rise" style="animation-delay:240ms"><text x="36" y="252" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">03</text><text x="76" y="252" class="sansb" font-size="15" fill="#e9dedb">Say what&#x27;s private.</text><text x="76" y="276" class="sans" font-size="13.5" fill="#b9a6a3">Drax isn&#x27;t public, so its card says PRIVATE instead of linking nowhere. Claims stay checkable.</text></g><g class="rise" style="animation-delay:300ms"><text x="36" y="310" class="mono" font-size="10" fill="#b8324e" letter-spacing="1.2">04</text><text x="76" y="310" class="sansb" font-size="15" fill="#e9dedb">Write it up.</text><text x="76" y="334" class="sans" font-size="13.5" fill="#b9a6a3">Lab reports and READMEs get the same care as the code: setup, limits, evidence.</text></g><rect width="880" height="376" rx="2" filter="url(#gr)" opacity=".05" pointer-events="none"/><rect x=".5" y=".5" width="879" height="375" rx="2" fill="none" stroke="rgba(233,222,219,.24)"/></svg>