<svg xmlns="http://www.w3.org/2000/svg" width="428" height="344" viewBox="0 0 428 344" role="img" aria-label="Quarters: Open, self-hostable virtual HQ: a pixel-art world with proximity voice and video, and Discord-style spaces."><title>Quarters: Open, self-hostable virtual HQ: a pixel-art world with proximity voice and video, and Discord-style spaces.</title><defs><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><radialGradient id="gl" cx="82%" cy="-12%" r="78%"><stop offset="0" stop-color="#8e2439" stop-opacity=".55"/><stop offset="1" stop-color="#0b0608" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.mono{font-family:'Space Mono',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sans{font-family:'Space Grotesk',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:600;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sansb{font-family:'Space Grotesk',Georgia,serif;font-weight:600}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes wipe{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both}.grow{animation:grow .7s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:50% 100%}.wipe{animation:wipe .6s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:0 50%}.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="427" height="343" rx="2" fill="#0b0608"/><g class="rise" style="animation-delay:440ms"><text x="26" y="30" class="mono" font-size="9.5" fill="#b8324e" letter-spacing="1.4">04</text><text x="52" y="30" class="mono" font-size="9.5" fill="#7b6663" letter-spacing="1.4">PRIVATE</text><text x="26" y="66" class="sansb" font-size="18" fill="#e9dedb">Quarters</text><line x1="26" y1="100" x2="402" y2="100" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="26" y="126" class="sans" font-size="13.5" fill="#b9a6a3">Open, self-hostable virtual HQ: a pixel-art world with</text><text x="26" y="146" class="sans" font-size="13.5" fill="#b9a6a3">proximity voice and video, and Discord-style spaces.</text><circle cx="29" cy="191.5" r="2.2" fill="#b8324e"/><text x="42" y="196" class="sans" font-size="13" fill="#b9a6a3">Proximity audio and video that react to where you stand</text><circle cx="29" cy="213.5" r="2.2" fill="#b8324e"/><text x="42" y="218" class="sans" font-size="13" fill="#b9a6a3">Self-hostable: one deploy for a whole team</text><circle cx="29" cy="235.5" r="2.2" fill="#b8324e"/><text x="42" y="240" class="sans" font-size="13" fill="#b9a6a3">Built as a workspace rather than a video call</text><text x="26" y="320" class="mono" font-size="9.5" fill="#7b6663" letter-spacing="1.1">Realtime  ·  Pixel art  ·  Self-hosted</text></g><rect width="428" height="344" rx="2" filter="url(#gr)" opacity=".05" pointer-events="none"/><rect x=".5" y=".5" width="427" height="343" rx="2" fill="none" stroke="rgba(233,222,219,.24)"/></svg>