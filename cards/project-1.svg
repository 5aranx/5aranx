<svg xmlns="http://www.w3.org/2000/svg" width="428" height="344" viewBox="0 0 428 344" role="img" aria-label="PUF drone authentication: Hardware-rooted UAV authentication. SRAM PUFs and BCH fuzzy extractors rebuild a 128-bit secret from silicon variation, so no key sits in flash."><title>PUF drone authentication: Hardware-rooted UAV authentication. SRAM PUFs and BCH fuzzy extractors rebuild a 128-bit secret from silicon variation, so no key sits in flash.</title><defs><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><radialGradient id="gl" cx="82%" cy="-12%" r="78%"><stop offset="0" stop-color="#8e2439" stop-opacity=".55"/><stop offset="1" stop-color="#0b0608" stop-opacity="0"/></radialGradient></defs><style>@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.mono{font-family:'Space Mono',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:400;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sans{font-family:'Space Grotesk',Georgia,serif;font-weight:400}@font-face{font-family:'Space Grotesk';font-weight:600;font-style:normal;src:url("data:font/woff;base64,") format('woff')}.sansb{font-family:'Space Grotesk',Georgia,serif;font-weight:600}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes wipe{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both}.grow{animation:grow .7s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:50% 100%}.wipe{animation:wipe .6s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box;transform-origin:0 50%}.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="427" height="343" rx="2" fill="#0b0608"/><g class="rise" style="animation-delay:280ms"><text x="26" y="30" class="mono" font-size="9.5" fill="#b8324e" letter-spacing="1.4">02</text><text x="52" y="30" class="mono" font-size="9.5" fill="#7b6663" letter-spacing="1.4">PUBLIC</text><g transform="translate(392 20)"><path d="M0 10 L10 0 M2.5 0 H10 V7.5" fill="none" stroke="#b8324e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="26" y="66" class="sansb" font-size="18" fill="#e9dedb">PUF drone authentication</text><circle cx="29" cy="82.5" r="2.2" fill="#555555"/><text x="37" y="86" class="mono" font-size="9.5" fill="#97817e">C</text><g transform="translate(56.814 77) scale(.9)"><path d="M5 .6 L6.5 3.7 L9.9 4.2 L7.4 6.6 L8 10 L5 8.4 L2 10 L2.6 6.6 L.1 4.2 L3.5 3.7 Z" fill="#97817e"/></g><text x="69.814" y="86" class="mono" font-size="9.5" fill="#97817e">1</text><line x1="26" y1="100" x2="402" y2="100" stroke="rgba(233,222,219,.11)" stroke-width="1"/><text x="26" y="126" class="sans" font-size="13.5" fill="#b9a6a3">Hardware-rooted UAV authentication. SRAM PUFs and</text><text x="26" y="146" class="sans" font-size="13.5" fill="#b9a6a3">BCH fuzzy extractors rebuild a 128-bit secret from silicon</text><text x="26" y="166" class="sans" font-size="13.5" fill="#b9a6a3">variation, so no key sits in flash.</text><circle cx="29" cy="193.5" r="2.2" fill="#b8324e"/><text x="42" y="198" class="sans" font-size="13" fill="#b9a6a3">Single-use nonce HMAC handshake between drone and</text><text x="42" y="216" class="sans" font-size="13" fill="#b9a6a3">ground station</text><circle cx="29" cy="233.5" r="2.2" fill="#b8324e"/><text x="42" y="238" class="sans" font-size="13" fill="#b9a6a3">A firmware dump yields public helper data and nothing</text><text x="42" y="256" class="sans" font-size="13" fill="#b9a6a3">else</text><circle cx="29" cy="273.5" r="2.2" fill="#b8324e"/><text x="42" y="278" class="sans" font-size="13" fill="#b9a6a3">ESP32 firmware in C, Flask command dashboard</text><text x="26" y="320" class="mono" font-size="9.5" fill="#7b6663" letter-spacing="1.1">SRAM PUF  ·  BCH  ·  HMAC  ·  Flask</text></g><rect width="428" height="344" rx="2" filter="url(#gr)" opacity=".05" pointer-events="none"/><rect x=".5" y=".5" width="427" height="343" rx="2" fill="none" stroke="rgba(233,222,219,.24)"/></svg>